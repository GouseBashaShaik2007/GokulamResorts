# Render Blueprint — deploys the Express/Socket.IO backend as an always-on
# web service. In the Render dashboard: New + -> Blueprint -> select this repo.
# Vars marked `sync: false` are prompted for in the dashboard (kept out of
# this file since it's committed to git).
services:
  - type: web
    name: gokulam-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Set this to your deployed Vercel frontend URL (comma-separated if more than one).
      - key: FRONTEND_URL
        sync: false

      # Supabase Postgres connection string (Project Settings -> Database -> Connection string -> URI).
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"

      # Supabase project (Project Settings -> API / Data API).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Auto-generated by Render — a fresh secret for this deployment, separate from local dev.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: STAFF_JWT_EXPIRES_IN
        value: 12h

      # Admin bootstrap account (used by `npm run db:seed`, and for /api/admin/login).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Shared password for kitchen dashboard devices.
      - key: KITCHEN_PASSWORD
        sync: false

      # Razorpay (leave blank to run in mock/no-payment mode).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: RESORT_TIMEZONE
        value: Asia/Kolkata
      - key: CLEANING_CRON
        value: "0 23 * * *"
      - key: BOOKING_HOLD_MINUTES
        value: "15"
      - key: BOOKING_APPROVAL_HOURS
        value: "24"

      # Guest ID documents — Supabase Storage (private bucket).
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_DOCS_BUCKET
        value: IdProofsupload
      - key: DOC_RETENTION_DAYS
        value: "90"

      # Public images (rooms, menu items) — Supabase Storage (public buckets).
      - key: SUPABASE_FOOD_IMAGES_BUCKET
        value: Food
      - key: SUPABASE_ROOM_IMAGES_BUCKET
        value: resort-images

      - key: NOTIFY_DRIVER
        value: log
