# Render Blueprint — deploys the Express/Socket.IO backend as a web service.
# In the Render dashboard: New + -> Blueprint -> select this repo.
#
# NOTE: `plan: free` below is NOT always-on. A free service sleeps after about
# 15 minutes without requests, and the background jobs sleep with it: unpaid
# holds expire late, unapproved bookings are refunded late, and the nightly
# jobs (11 PM cleaning check, 3:30 AM ID-document deletion) are usually missed.
# Before taking real bookings, move to a paid plan (e.g. `starter`).
# Vars marked `sync: false` are prompted for in the dashboard (kept out of
# this file since it's committed to git).
services:
  - type: web
    name: gokulam-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Set this to your deployed Vercel frontend URL (comma-separated if more than one).
      - key: FRONTEND_URL
        sync: false

      # Supabase Postgres connection string (Project Settings -> Database -> Connection string -> URI).
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"

      # Supabase project (Project Settings -> API / Data API).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Auto-generated by Render — a fresh secret for this deployment, separate from local dev.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: STAFF_JWT_EXPIRES_IN
        value: 12h

      # Admin bootstrap account (used by `npm run db:seed`, and for /api/admin/login).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Kitchen display: each cook signs in with their own PIN, set in
      # Admin -> Settings. (There is no shared kitchen password any more.)
      - key: KITCHEN_JWT_EXPIRES_IN
        value: 12h

      # Food ordering: every printed QR code carries a key made from this
      # secret, and orders are refused without it. Kept separate from
      # JWT_SECRET so that changing the login secret doesn't break the printed
      # codes. Changing THIS one retires every printed code at once (reprint
      # them from Admin -> QR Codes).
      - key: ORDER_LINK_SECRET
        generateValue: true

      # Render puts one proxy in front of the service; trusting it lets rate
      # limits count each visitor separately.
      - key: TRUST_PROXY
        value: "1"

      # Razorpay (leave blank to run in mock/no-payment mode).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: RESORT_TIMEZONE
        value: Asia/Kolkata
      - key: CLEANING_CRON
        value: "0 23 * * *"
      - key: BOOKING_HOLD_MINUTES
        value: "15"
      - key: BOOKING_APPROVAL_HOURS
        value: "24"

      # Guest ID documents — Supabase Storage (private bucket).
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_DOCS_BUCKET
        value: IdProofsupload
      - key: DOC_RETENTION_DAYS
        value: "90"

      # Public images (rooms, menu items) — Supabase Storage (public buckets).
      - key: SUPABASE_FOOD_IMAGES_BUCKET
        value: Food
      - key: SUPABASE_ROOM_IMAGES_BUCKET
        value: resort-images

      - key: NOTIFY_DRIVER
        value: log
